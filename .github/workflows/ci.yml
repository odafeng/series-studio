name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: bash -n install.sh
      - run: bash tests/test_install.sh
      - run: python -m compileall -q claude
      - run: pytest -q

  remotion-template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude/series-studio/template/remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: claude/series-studio/template/remotion/package-lock.json
      - run: npm ci
      - run: npm run typecheck
